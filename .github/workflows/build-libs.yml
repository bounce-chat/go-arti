name: Build Arti libraries

# Verifies the static Arti library builds for every supported target, links
# from Go on each of them, and runs the test suites. Nothing is published: the
# library is built from source by whoever consumes it.

# cgo.go is in the path lists because its #cgo lines are what the link step in
# the build job checks; a change to them is a change to what gets linked.
on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'Makefile'
      - 'internal/arti/cgo.go'
      - '.github/workflows/build-libs.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'Makefile'
      - 'internal/arti/cgo.go'
      - '.github/workflows/build-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target is built on an OS that has a native C toolchain for it:
          # the SQLite and liblzma dependencies are compiled from source, so a
          # working cross-C setup matters as much as the Rust target.
          - { runner: ubuntu-latest, goos: linux,   goarch: amd64, triple: x86_64-unknown-linux-gnu }
          # `cc` is the C compiler cgo needs to link a target the runner cannot
          # produce with its default one.
          - { runner: ubuntu-latest, goos: linux,   goarch: arm64, triple: aarch64-unknown-linux-gnu, cc: aarch64-linux-gnu-gcc }
          - { runner: macos-latest,  goos: darwin,  goarch: arm64, triple: aarch64-apple-darwin }
          - { runner: macos-latest,  goos: darwin,  goarch: amd64, triple: x86_64-apple-darwin }
          - { runner: windows-latest, goos: windows, goarch: amd64, triple: x86_64-pc-windows-gnu }

    steps:
      - uses: actions/checkout@v4

      # `make lib` stamps the Rust fingerprint with a Go program and the last
      # step links from Go, so this job needs a Go toolchain as well as Rust.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      # Only the package. The Makefile points cargo and the cc crate at the
      # cross compiler itself, and takes objcopy from the same binutils.
      - name: Install the aarch64 cross toolchain
        if: matrix.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # MinGW is the C compiler and linker for the *-pc-windows-gnu triple, and
      # make is not on the Windows image at all. Neither supplies the tool that
      # strips the archive: MinGW's objcopy cannot copy one with this many
      # repeated member names, so on Windows the Makefile uses the rust-objcopy
      # that comes with the Rust toolchain.
      - name: Install MinGW and make
        if: matrix.triple == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          choco install mingw make --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> "$GITHUB_PATH"

      # Through the Makefile, not a copy of its recipe. This step used to run
      # `cargo build` itself, so CI tested an archive that nobody else builds:
      # `make lib` also strips the embedded LLVM bitcode that Go 1.27.4 and
      # 1.26.11 refuse to link (https://go.dev/issue/83126), picking a tool
      # that can do it for each target, and a bare `cargo build` does neither.
      - name: Build
        shell: bash
        run: make lib GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      # Only a test binary proves a platform's #cgo line: `go build` and
      # `go vet` both pass with a system library missing from it. Nothing here
      # used to link anywhere but Linux, and the macOS line was missing
      # -framework IOKit.
      #
      # Where the runner can execute the target, the tests run too. Where it
      # cannot (linux/arm64 from x86, darwin/amd64 from Apple Silicon) the link
      # is the whole check, and cgo has to be switched on by hand because
      # cross-compiling turns it off.
      - name: Link from Go, and test where the runner can run the result
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CROSS_CC: ${{ matrix.cc }}
        run: |
          if [ "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$GOOS/$GOARCH" ]; then
            go test ./...
          else
            if [ -n "$CROSS_CC" ]; then export CC="$CROSS_CC"; fi
            go test -c -o "$RUNNER_TEMP/arti.test" ./internal/arti
          fi

      - name: Stage the artifact
        shell: bash
        run: |
          name="libarti_ffi-${{ matrix.goos }}_${{ matrix.goarch }}.a"
          mkdir -p dist
          cp "lib/${{ matrix.goos }}_${{ matrix.goarch }}/libarti_ffi.a" "dist/${name}"
          ls -la dist

      # Kept only so the test job can link against the host build; these are
      # not release artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: libarti_ffi-${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.a
          retention-days: 1

  # The fingerprint must come out identical on every platform, because the job
  # below diffs the committed value. Checking that on one Linux runner makes it
  # an aspiration rather than a test, and Windows is both the likeliest place to
  # diverge - path separators and core.autocrlf - and the one nothing recomputed.
  #
  # This needs no Rust toolchain and no archive: tools/stamp only reads sources.
  # LANG is set explicitly on macOS because CI's empty LANG masks exactly the
  # collation class of bug that moving the sort into Go was meant to rule out.
  fingerprint:
    name: Fingerprint is reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Recompute and compare
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          go run ./tools/stamp
          git diff --exit-code internal/arti/libstamp.go

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: dtolnay/rust-toolchain@stable

      - name: Feature set is unchanged
        run: make check-features

      # A stale fingerprint would let a Rust change land without forcing
      # dependent Go builds to relink against the rebuilt library.
      - name: Rust fingerprint is current
        run: |
          make stamp
          git diff --exit-code internal/arti/libstamp.go

      - name: Rust tests
        run: cd rust/arti-ffi && cargo test

      - uses: actions/download-artifact@v4
        with:
          name: libarti_ffi-linux_amd64
          path: dist

      - name: Install the library where cgo expects it
        run: |
          mkdir -p lib/linux_amd64
          cp dist/libarti_ffi-linux_amd64.a lib/linux_amd64/libarti_ffi.a

      - name: Go tests
        run: go test ./...

      # The cgo constraint table is checked by internal/buildcheck, which runs
      # as part of `go test ./...` above.
      #
      # This step used to be `GOOS=windows GOARCH=amd64 go vet ./...`, which
      # cannot work. Cross-compiling defaults CGO_ENABLED=0, a file importing
      # "C" is then excluded from the package, and every symbol cgo.go defines
      # becomes undefined - so it printed a wall of "undefined: artiClient"
      # errors on every run without ever parsing a #cgo line. It was wrapped in
      # `|| true` and so could never fail, which only trained people to ignore
      # the output. Genuinely type-checking a cgo package for another platform
      # needs a cross C toolchain and that platform's archive, and the build
      # job above already covers that ground by compiling all five targets
      # natively.
